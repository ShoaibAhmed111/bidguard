services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidguard-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
    networks:
      - bidguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bidguard-frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - bidguard-net

  redis:
    image: redis:7-alpine
    container_name: bidguard-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bidguard-net

volumes:
  redis-data:

networks:
  bidguard-net:
    driver: bridge
